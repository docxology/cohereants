# cohereants - Insect Olfaction Research Project
#
# Research project investigating the vibrational theory of olfaction in insects,
# exploring how insects may detect infrared radiation from semiochemicals rather
# than relying solely on molecular binding mechanisms.
#
# For documentation and usage, see:
# - README.md - Project overview and research details
# - ARCHITECTURE.md - System design and implementation
# - WORKFLOW.md - Development and research workflow
# - HOW_TO_USE.md - Complete usage guide
#
# Repository: https://github.com/your-repo/cohereants

[project]
name = "cohereants"
version = "0.1.0"
description = "When do bugs see (infra)red? On the Visual and Infra-red in the Insect Perceptual Apparatus"
authors = [
    { name = "Tucker Chambers, Daniel A. Friedman" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["entomology", "insect-olfaction", "infrared-detection", "vibrational-theory", "semiochemicals", "sensilla", "antennae", "electromagnetic-sensing", "neuroscience", "behavioral-ecology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "pytest>=6.0",
    "pytest-cov>=3.0",
    "scikit-learn>=1.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[tool.uv]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pydocstyle>=6.3.0",
    "pytest>=8.4.1",
    "pytest-cov>=4.0",
]

