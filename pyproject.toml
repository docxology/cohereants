# cohereants — Insect Infra-red Perception Research Project
# "When do bugs see (infra)red? On the Visual and Infra-red in the Insect Perceptual Apparatus"
#
# Adapted from github.com/docxology/cohereants (Tucker Chambers, Daniel A. Friedman)
# into the Research Project Template's two-layer structure. Inherits workspace
# settings from the root pyproject.toml; this file pins the per-project test +
# coverage contract that the template's pipeline enforces.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cohereants"
version = "0.1.0"
description = "When do bugs see (infra)red? On the Visual and Infra-red in the Insect Perceptual Apparatus"
authors = [
    {name = "Tucker Chambers"},
    {name = "Daniel A. Friedman"},
]
requires-python = ">=3.10"
keywords = [
    "entomology", "insect-olfaction", "infrared-detection", "vibrational-theory",
    "semiochemicals", "sensilla", "antennae", "electromagnetic-sensing",
    "neuroscience", "behavioral-ecology", "active-inference",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# Template convention: src is importable as `src.X` (and bare `X` via conftest path-shim).
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
# Markers preserved from the upstream cohereants pytest.ini (which we dropped in favour
# of the template's pyproject-based config). --strict-markers requires them registered.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "visualization: marks tests that generate visualizations",
    "file_io: marks tests that perform file I/O operations",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:matplotlib.*",
]

[tool.coverage.run]
# Only measure project source — test code must not inflate the metric.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the template's enforced project gate.
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml
