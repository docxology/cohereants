# cohereants — manuscript metadata meta-artifact.
# Loaded by infrastructure/rendering/_pdf_combined_renderer.py (metadata) and
# infrastructure.publishing.extract_publication_metadata. Mirrors the
# template_code_project contract; adapted from github.com/docxology/cohereants.

paper:
  title: "When do bugs see (infra)red?"
  subtitle: "On the Visual and Infra-red in the Insect Perceptual Apparatus"
  version: "1.0.0"
  date: "" # Auto-generated by infrastructure/validation/output/validator.py if empty

authors:
  - name: "Tucker Chambers"
    orcid: "0009-0008-3793-7872"
    affiliation: "Independent Researcher"
    corresponding: true
  - name: "Daniel A. Friedman"
    orcid: "0000-0001-6232-9096"
    affiliation: "Active Inference Institute"

publication:
  doi: "10.5281/zenodo.20450880" # Concept DOI — stable citation; cover page + CITATION.cff
  version_doi: "10.5281/zenodo.20450970" # Latest Zenodo deposit (set by publish_project_release.py)
  version_record: "https://zenodo.org/records/20450970"
  github_repository: "docxology/cohereants"
  journal: ""
  year: "2026"

keywords:
  - "insect olfaction"
  - "infrared detection"
  - "vibrational theory of olfaction"
  - "semiochemicals"
  - "sensilla morphology"
  - "electromagnetic sensing"
  - "active inference"
  - "reproducible research"

metadata:
  license: "Apache-2.0"
  language: "en"

# Render format toggles. Defaults mirror the code exemplar: pdf/html on; docx/epub off.
render:
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false

# LLM review/translation toggles. Off by default (requires a running Ollama server);
# enable locally to exercise infrastructure/llm.
llm:
  reviews:
    enabled: false
    types:
      - executive_summary
      - quality_review
      - methodology_review
  translations:
    enabled: false
    languages:
      - zh

# ZERO-MOCK TOLERANCE: any test failure blocks manuscript rendering.
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0
